name: PR Author Policy

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce-maintainer-author:
    name: Enforce Maintainer Author
    runs-on: ubuntu-latest
    steps:
      - name: Close pull requests from unauthorized authors
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const trustedBots = new Set(['dependabot[bot]']);

            if (trustedBots.has(author)) {
              core.info(`Allowing pull request from trusted bot ${author}.`);
              return;
            }

            let permission = 'none';
            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: author,
              });
              permission = response.data.permission;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (permission === 'admin' || permission === 'maintain') {
              core.info(`Allowing pull request from ${author} with ${permission} permission.`);
              return;
            }

            const issueUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new/choose`;
            const message = [
              'Thanks for taking the time to contribute.',
              '',
              'This repository accepts pull requests only from maintainers. Public issue creation remains open, so please share the bug report, feature request, or proposed change through an issue instead:',
              issueUrl,
              '',
              'A maintainer will triage the issue and, if approved, prepare the implementation pull request.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed',
            });

            core.notice(`Closed pull request from ${author} with ${permission} permission.`);
